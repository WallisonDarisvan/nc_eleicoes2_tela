# Cache persistente em disco para blindagem da CDN do TSE
# Armazena as respostas do TSE online no servidor para entrega contínua mesmo se a CDN cair
proxy_cache_path /var/cache/nginx/tse levels=1:2 keys_zone=tse_cache:20m max_size=1g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression para máxima velocidade de carregamento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Suporte a SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Otimização de cache para assets estáticos
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy reverso inteligente para a CDN oficial do TSE com cache em disco e escudo anti-queda
    location /tse-api/ {
        resolver 1.1.1.1 8.8.8.8 1.0.0.1 8.8.4.4 valid=300s ipv6=off;
        resolver_timeout 5s;
        proxy_pass https://resultados.tse.jus.br/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host resultados.tse.jus.br;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header Accept "application/json, text/plain, */*";
        proxy_set_header Accept-Encoding "gzip, deflate, br";

        # Configuração do Cache Online no Servidor
        proxy_cache tse_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";

        # Ignora cabeçalhos restritivos da CDN do TSE para garantir o salvamento no servidor
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        # Dados válidos são mantidos frescos por 3 segundos (atualização em tempo real)
        proxy_cache_valid 200 304 3s;

        # ESCUDO ANTI-QUEDA (STALE): Se o TSE cair (500, 502, 503, 504, 403, 404, timeout ou erro de rede),
        # o Nginx entrega imediatamente o último snapshot online salvo para todos os usuários!
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504 http_403 http_404;

        # Evita avalanche de requisições: se dezenas de clientes pedirem ao mesmo tempo, apenas 1 vai ao TSE
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;

        # Cabeçalhos CORS e indicador do status do cache
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
